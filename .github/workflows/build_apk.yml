name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: 🔑 Decode Debug Keystore (if exists)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: 🔨 Build Debug APK with Gradle
        run: |
          # If gradlew is present, make it executable, else use gradle CLI
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 📦 Locate & Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p release_apk
          cp "$APK_PATH" release_apk/TheJanakpurWaffleCafe.apk
          echo "apk_path=release_apk/TheJanakpurWaffleCafe.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact (Download from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TheJanakpurWaffleCafe-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🏷️ Create GitHub Release with APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "The Janakpur Waffle & Cafe v1.0.${{ github.run_number }}"
          body: |
            ### 🧇 The Janakpur Waffle & Cafe - Android APK
            
            **Download and install directly on your Android phone:**
            - 📲 **Download APK**: [TheJanakpurWaffleCafe.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/TheJanakpurWaffleCafe.apk)
            
            #### 🌟 Features:
            - 🧇 100% Pure Veg & Eggless Waffles, Pancakes, Momos, Pizzas, and Shakes
            - 🛒 Cart, Delivery / Dine-In / Takeaway options & Kitchen notes
            - 🇳🇵 eSewa, Khalti, Cash on Delivery & QR payments
            - 💬 1-Click WhatsApp Order Export to `+977-9706612914`
            - 📱 In-Cafe Table QR Code Scanner
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
